---
layout: default
---
<article>
  <div class="page-hero">
    <div class="wrap post-head">
      <span class="eyebrow">Legal</span>
      <h1>{{ page.title }}</h1>
      {% if page.effective %}<p>Effective date: {{ page.effective }}</p>{% endif %}
    </div>
  </div>
  <div class="wrap post-body legal-body">
    {{ content }}
  </div>
</article>
